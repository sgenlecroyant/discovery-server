services:
  discovery-server:
    image: sgenlecroyant/discovery-server:latest
    container_name: discovery-server
    restart: always
    ports:
      - "1010:1010"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    networks:
      - backend

networks:
  backend:
    external: true